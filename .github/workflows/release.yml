name: Release

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test -race ./...

  release:
    name: Build and publish release
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: write
    # Serialize runs so concurrent pushes to main cannot race on the next tag.
    concurrency:
      group: release
    # macOS runner: the menubar (fyne.io/systray) needs cgo for the darwin
    # binaries; linux binaries are cross-compiled with cgo disabled.
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Full history so the latest release tag is available for the bump.
          fetch-depth: 0
          persist-credentials: false

      - name: Determine release tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            latest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
            latest=${latest:-v0.0.0}
            IFS=. read -r major minor patch <<<"${latest#v}"
            echo "RELEASE_TAG=v${major}.${minor}.$((patch + 1))" >> "$GITHUB_ENV"
          fi

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"

      - name: Build release binaries
        run: |
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os=${target%/*}
            arch=${target#*/}
            cgo=0
            if [[ "$os" == darwin ]]; then
              cgo=1
            fi
            CGO_ENABLED="$cgo" GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=${RELEASE_TAG}" -o "dist/colimui_${os}_${arch}" .
          done

      - name: Create checksums
        working-directory: dist
        run: shasum -a 256 colimui_* > checksums.txt

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --clobber
          else
            # Creating the release also creates the tag at the built commit.
            gh release create "${RELEASE_TAG}" dist/* \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "colimUI ${RELEASE_TAG}"
          fi
